x-common-env: &common-env
  IN_DOCKER: "true"
  DATABASE_URL: postgresql://sports:sports@postgres:5432/sports_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DJANGO_SETTINGS_MODULE: sports_platform.settings.local
  SECRET_KEY: local-dev-secret-key-not-for-prod
  DEBUG: "true"
  API_FOOTBALL_KEY: "${API_FOOTBALL_KEY:-}"

x-django-base: &django-base
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  volumes:
    - .:/app
  environment:
    <<: *common-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  # ─── Core Infrastructure ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sports_db
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.5-alpine
    command: redis-server --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (KRaft mode — no ZooKeeper) ───────────────────────────────────
  kafka:
    image: apache/kafka:3.7.2
    ports:
      - "9092:9092"
      - "9094:9094"   # External listener for host-machine access
    environment:
      # KRaft (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Listeners
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # Performance
      KAFKA_MESSAGE_MAX_BYTES: 10485760   # 10MB max message
      CLUSTER_ID: "4L622nShTZaJvtPGBm-ICg"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ─── Kafka UI ─────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ─── Database Migration & Setup ──────────────────────────────────────────
  migrate:
    <<: *django-base
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py makemigrations users sports matches preferences &&
             python manage.py migrate &&
             python manage.py create_kafka_topics &&
             python manage.py seed_sports &&
             python manage.py seed_matches"
    restart: "no"

  # ─── Application Services ────────────────────────────────────────────────
  api:
    <<: *django-base
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Kafka Consumers ─────────────────────────────────────────────────────
  kafka-consumers:
    <<: *django-base
    command: python manage.py run_kafka_consumers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Celery Worker (ingestion tasks) ─────────────────────────────────────
  celery-worker:
    <<: *django-base
    command: celery -A sports_platform worker -l INFO -Q ingestion,default
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Celery Beat (scheduler) ─────────────────────────────────────────────
  celery-beat:
    <<: *django-base
    command: celery -A sports_platform beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── WebSocket Gateway (FastAPI Microservice) ────────────────────────────
  ws-gateway:
    build:
      context: ../pulse-ws-gateway
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: local-dev-jwt-signing-key-change-in-production
      JWT_ALGORITHM: HS256
      ENVIRONMENT: local
    volumes:
      - ../pulse-ws-gateway:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
