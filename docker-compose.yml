version: "3.9"

x-common-env: &common-env
  DATABASE_URL: postgresql://sports:sports@postgres:5432/sports_db
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DJANGO_SETTINGS_MODULE: sports_platform.settings.local
  SECRET_KEY: local-dev-secret-key-not-for-prod
  DEBUG: "true"
  API_FOOTBALL_KEY: "${API_FOOTBALL_KEY:-}"

x-django-base: &django-base
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  volumes:
    - .:/app
  environment:
    <<: *common-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  # ─── Core Infrastructure ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sports_db
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (KRaft mode — no ZooKeeper) ───────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
      - "9094:9094"   # External listener for host-machine access
    environment:
      # KRaft (no ZooKeeper)
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Listeners
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Topic defaults
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"  # 7 days
      KAFKA_CFG_LOG_SEGMENT_BYTES: "1073741824"
      # Performance
      KAFKA_CFG_MESSAGE_MAX_BYTES: "10485760"   # 10MB max message
      KAFKA_CFG_REPLICA_FETCH_MAX_BYTES: "10485760"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ─── Kafka UI ─────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ─── Application Services ────────────────────────────────────────────────
  api:
    <<: *django-base
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py create_kafka_topics &&
             python manage.py seed_sports &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  # ─── Kafka Consumers ─────────────────────────────────────────────────────
  kafka-consumers:
    <<: *django-base
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py run_kafka_consumers"
    restart: unless-stopped

  # ─── Celery Worker (ingestion tasks) ─────────────────────────────────────
  celery-worker:
    <<: *django-base
    command: >
      sh -c "python manage.py wait_for_db &&
             celery -A sports_platform worker -l INFO -Q ingestion,default"
    restart: unless-stopped

  # ─── Celery Beat (scheduler) ─────────────────────────────────────────────
  celery-beat:
    <<: *django-base
    command: >
      sh -c "python manage.py wait_for_db &&
             celery -A sports_platform beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
